
name: Docker Build and Push

on:
  push:
    branches:
      - main
      - feature/DockerContainers

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-python-app ./Dockers
